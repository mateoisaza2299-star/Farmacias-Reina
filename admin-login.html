  <meta property="og:site_name" content="Droguerías Reina">
  <meta property="og:url" content="https://mateoisaza2299-star.github.io/Farmacias-Reina/admin-login.html">
  <meta property="og:title" content="Droguería en Funza · Droguerías Reina">
  <meta property="og:description" content="Pide tus medicamentos en línea y recíbelos en casa en Funza y Mosquera. Pagas al recibir.">
  <meta property="og:image" content="https://mateoisaza2299-star.github.io/Farmacias-Reina/assets/og/og-droguerias-reina-v2.jpg">
  <meta property="og:image:secure_url" content="https://mateoisaza2299-star.github.io/Farmacias-Reina/assets/og/og-droguerias-reina-v2.jpg">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Logo de Droguerías Reina, droguería en Funza">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Droguería en Funza · Droguerías Reina">
  <meta name="twitter:description" content="Pide tus medicamentos en línea y recíbelos en casa en Funza y Mosquera. Pagas al recibir.">
  <meta name="twitter:image" content="https://mateoisaza2299-star.github.io/Farmacias-Reina/assets/og/og-droguerias-reina-v2.jpg">
  <meta name="theme-color" content="#0077D5">
  <link rel="icon" href="assets/logo/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="icon" href="assets/logo/favicon-48.png" type="image/png" sizes="48x48">
  <link rel="apple-touch-icon" href="assets/logo/apple-touch-icon.png">
  <link rel="preload" href="fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="login">
  <a class="skip" href="#contenido">Saltar al contenido</a>
  <main id="contenido" class="login-wrap">
    <form class="login-card" id="acceso">
      <a class="logo" href="index.html" data-logo>
        <img class="logo-img" src="assets/logo/logo-192.png" width="44" height="44" alt="" fetchpriority="high" decoding="async">
        <span class="logo-text"><span class="logo-name" data-nombre>Droguerías Reina</span><span class="logo-place">Acceso interno</span></span>
      </a>
      <h1>Panel de la droguería</h1>
      <p class="hint">Ingresa con la cuenta del equipo. No hay registro público.</p>
      <p class="form-error" data-login-error role="alert" hidden></p>
      <fieldset data-paso="clave">
        <label>Correo
          <input name="email" type="email" autocomplete="username" required>
        </label>
        <label>Contraseña
          <input name="password" type="password" autocomplete="current-password" required>
        </label>
        <button class="btn btn-primary" type="submit" data-entrar>Entrar</button>
      </fieldset>
      <fieldset data-paso="codigo" hidden>
        <p class="hint">Escribe el código de la aplicación de verificación.</p>
        <label>Código de verificación
          <input name="codigo" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}">
        </label>
        <button class="btn btn-primary" type="submit" data-verificar>Verificar</button>
        <button class="btn btn-ghost" type="button" data-volver>Volver</button>
      </fieldset>
      <a href="index.html">Volver a la tienda</a>
    </form>
  </main>
  <script type="module" src="js/login.js"></script>
</body>
</html>
